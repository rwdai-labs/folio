name: folio

services:
  folio:
    image: ghcr.io/rwdai-labs/folio-service:main
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TZ: Asia/Shanghai
      # HTTPS git credential for the context repository. Preferred over a gh
      # session; set it in .env next to this file.
      GIT_AUTH_TOKEN: "${GIT_AUTH_TOKEN:-}"
      TRUSTED_HOSTS: localhost,127.0.0.1
      MAINTENANCE_SCHEDULER_ENABLED: "true"
      MAINTENANCE_INTERVAL_SECONDS: "86400"
      HTTP_PROXY: "${HTTP_PROXY:-${http_proxy:-}}"
      HTTPS_PROXY: "${HTTPS_PROXY:-${https_proxy:-}}"
      NO_PROXY: "${NO_PROXY:-${no_proxy:-localhost,127.0.0.1}}"
      http_proxy: "${HTTP_PROXY:-${http_proxy:-}}"
      https_proxy: "${HTTPS_PROXY:-${https_proxy:-}}"
      no_proxy: "${NO_PROXY:-${no_proxy:-localhost,127.0.0.1}}"
    volumes:
      - folio-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - /app/folio
        - healthcheck
        - --url
        - http://127.0.0.1:8080/
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

volumes:
  folio-data:
    name: folio-data
