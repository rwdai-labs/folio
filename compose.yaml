name: folio

services:
  folio:
    image: ghcr.io/rwdai-labs/folio-service:main
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TZ: Asia/Shanghai
      TRUSTED_HOSTS: localhost,127.0.0.1
      MAINTENANCE_SCHEDULER_ENABLED: "true"
      MAINTENANCE_INTERVAL_SECONDS: "86400"
    volumes:
      - folio-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - /app/folio
        - healthcheck
        - --url
        - http://127.0.0.1:8080/
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

volumes:
  folio-data:
    name: folio-data
